$kind: collection
name: API Inbox P4 Local Resilience
description: Casos negativos y stateful exclusivos del mock local; nunca ejecutar contra DEV o PRD.
variables:
  - key: base_url
    value: 'http://127.0.0.1:0'
  - key: phone
    value: '56911111111'
  - key: access_token
    value: local-test-token
  - key: duplicate_client_id
    value: 11111111-1111-4111-8111-111111111111
