$kind: http-request
name: Rechazar JSON malformado
method: POST
url: '{{base_url}}/conversaciones/:telefono/respuestas'
order: 2000
pathVariables:
  - key: telefono
    value: '{{phone}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{"clientMessageId":'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 400", () => pm.response.to.have.status(400));
      pm.test("Codigo estable", () => pm.expect(pm.response.json().code).to.eql("INVALID_JSON"));
