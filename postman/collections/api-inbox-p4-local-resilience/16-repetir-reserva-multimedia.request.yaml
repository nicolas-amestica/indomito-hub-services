$kind: http-request
name: Repetir reserva multimedia
method: POST
url: '{{base_url}}/conversaciones/:telefono/adjuntos/preparar'
order: 16000
pathVariables:
  - key: telefono
    value: '{{phone}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"batchId":"eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee","files":[{"clientMessageId":"66666666-6666-4666-8666-666666666666","fileName":"idempotent.pdf","mimeType":"application/pdf","size":23,"checksumSha256":"expected-checksum"}]}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Reserva repetida aceptada", () => pm.response.to.have.status(200));
      pm.test("Upload estable", () => pm.expect(pm.response.json().data.uploads[0].uploadId).to.eql(pm.collectionVariables.get("idempotent_upload_id")));
