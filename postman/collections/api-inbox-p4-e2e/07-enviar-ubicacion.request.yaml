$kind: http-request
name: Enviar ubicación
method: POST
url: '{{base_url}}/conversaciones/:telefono/mensajes-enriquecidos'
order: 7000
pathVariables:
  - key: telefono
    value: '{{phone}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "clientMessageId": "{{rich_client_message_id}}",
      "kind": "location",
      "location": {
        "latitude": -33.4489,
        "longitude": -70.6693,
        "name": "Punto de prueba P4",
        "address": "Santiago, Chile"
      }
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set("rich_client_message_id", pm.variables.replaceIn("{{$guid}}"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Ubicación aceptada o confirmada", () => pm.expect(pm.response.code).to.be.oneOf([200, 202]));
      pm.test("Ubicación conserva idempotencia", () => pm.expect(pm.response.json().data.clientMessageId).to.eql(pm.collectionVariables.get("rich_client_message_id")));
