$kind: http-request
name: Enviar contacto
method: POST
url: '{{base_url}}/conversaciones/:telefono/mensajes-enriquecidos'
order: 8000
pathVariables:
  - key: telefono
    value: '{{phone}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "clientMessageId": "{{rich_client_message_id}}",
      "kind": "contacts",
      "contacts": [{
        "name": "Contacto Prueba P4",
        "phone": "+56911111111",
        "email": "",
        "company": "Giras Indómito"
      }]
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set("rich_client_message_id", pm.variables.replaceIn("{{$guid}}"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Contacto aceptado o confirmado", () => pm.expect(pm.response.code).to.be.oneOf([200, 202]));
      pm.test("Contacto conserva idempotencia", () => pm.expect(pm.response.json().data.clientMessageId).to.eql(pm.collectionVariables.get("rich_client_message_id")));
