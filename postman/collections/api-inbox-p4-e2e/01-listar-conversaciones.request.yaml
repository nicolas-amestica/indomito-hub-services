$kind: http-request
name: Listar conversaciones
method: GET
url: '{{base_url}}/conversaciones?page=1&pageSize=20'
order: 1000
queryParams:
  - key: page
    value: '1'
  - key: pageSize
    value: '20'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Colección y paginación presentes", () => {
        const body = pm.response.json();
        pm.expect(body.data).to.be.an("array");
        pm.expect(body.pageInfo).to.be.an("object");
      });
